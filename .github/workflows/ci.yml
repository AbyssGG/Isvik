name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.4'

      - name: Verify Environment
        run: |
          nim -v
          gcc --version

      - name: Tab Check
        run: |
          nimble tabcheck

      - name: Build Isvik Binary
        run: |
          nimble build

      - name: Run Test Suites
        run: |
          nimble test

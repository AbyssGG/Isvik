name: Release packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach packages to
        required: true
        default: v0.1.2
        type: string
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.4'

      - name: Build executable
        run: nimble build

      - name: Package executable
        run: python scripts/package_release.py "${{ inputs.tag || github.ref_name }}" "${{ matrix.platform }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: isvik-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach packages to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.zip
          overwrite_files: true

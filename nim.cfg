# Isvik 构建配置
#
# 该文件被项目内所有 Nim 编译单元自动读取(Nim 会从被编译文件所在目录
# 逐级向上查找 nim.cfg),因此 src/、tests/、examples/ 共享同一套设置。

# ---------------------------------------------------------------------------
# C 编译器后端:必须钉在 gcc
# ---------------------------------------------------------------------------
#
# 原因是硬性的,不是偏好:
# Resonance/src/resonance/perf_count_wrapper.c 使用了 GCC 专属语法
#   - __attribute__((ms_abi))
#   - __declspec(dllexport) ... __cdecl
#   - 手写的 LoadLibraryA / GetProcAddress 声明
# 该文件的存在是为了绕过 Windows x64 上「MSVC 编译的 openvino_c.dll」与
# 「MinGW 编译的 Nim 代码」之间跨 ABI 变参调用不可靠的问题。
# 若改用 --cc:vcc,该 C 文件将无法编译。
#
# 本机已验证的工具链:gcc (tdm64-1) 10.3.0
cc = "gcc"

# ---------------------------------------------------------------------------
# 模块搜索路径
# ---------------------------------------------------------------------------

# Isvik 自身源码
--path:"src"

# Resonance:Isvik 的基础库(Master Prompt §0.5.2)
# 仅 src/isvik/backends/openvino/ 允许 import 它,该约束由
# tests/architecture/tarchitecture.nim 强制检查。
--path:"Resonance/src"

# ---------------------------------------------------------------------------
# 内存管理
# ---------------------------------------------------------------------------

# Nim 2.x 默认 ORC。显式写出以免将来默认值变化导致行为漂移。
--mm:orc
